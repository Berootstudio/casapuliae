<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Admin - Casa Apuliae</title>
  <link rel="stylesheet" href="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
  </style>
</head>
<body>
  <!-- Netlify Identity Widget -->
  <div data-netlify-identity-menu></div>
  
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    // Inizializza Netlify Identity
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
    
    // Gestisce recovery token
    if (window.location.hash.match(/^(#|#recovery_token=)/)) {
      // Il token è già presente, Netlify Identity lo gestisce automaticamente
      // ma assicuriamoci che il widget sia visibile
      if (window.netlifyIdentity) {
        window.netlifyIdentity.open();
      }
    }
    
    // Inizializza Decap CMS
    CMS.init();
  </script>
</body>
</html>
