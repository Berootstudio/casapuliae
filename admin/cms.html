<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Admin - Casa Apuliae</title>
  <link rel="stylesheet" href="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    .admin-header {
      background: #1d4f4d;
      color: white;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .admin-header h1 {
      font-weight: 300;
      letter-spacing: 4px;
      font-size: 1.2rem;
    }
    .admin-header span {
      color: #c9a962;
      letter-spacing: 2px;
      font-size: 0.8rem;
    }
    .logout-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.3);
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
    }
    .logout-btn:hover {
      background: rgba(255,255,255,0.2);
    }
    #nc-root {
      margin-top: 0;
    }
  </style>
</head>
<body>
  <div class="admin-header">
    <div>
      <h1>CASA <span>APULIAE</span></h1>
    </div>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>
  
  <script>
    // Verifica autenticazione
    if (!sessionStorage.getItem('admin_logged_in')) {
      window.location.href = '/admin/login.html';
    }
    
    function logout() {
      sessionStorage.removeItem('admin_logged_in');
      window.location.href = '/admin/login.html';
    }
  </script>
  
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    // Inizializza Netlify Identity
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/cms.html";
          });
        }
      });
    }
    
    // Gestisce token recovery/invite
    if (window.location.hash.match(/^(#|#recovery_token=|#invite_token=)/)) {
      if (window.netlifyIdentity) {
        window.netlifyIdentity.open();
      }
    }
    
    // Inizializza Decap CMS
    CMS.init();
  </script>
</body>
</html>
