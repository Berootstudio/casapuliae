<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Login - Casa Apuliae Admin</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1d4f4d 0%, #2c5f5d 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .login-container {
      background: white;
      padding: 3rem;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 400px;
    }
    
    .logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    
    .logo h1 {
      color: #1d4f4d;
      font-size: 1.8rem;
      font-weight: 300;
      letter-spacing: 4px;
    }
    
    .logo span {
      display: block;
      color: #c9a962;
      font-size: 0.9rem;
      margin-top: 0.5rem;
      letter-spacing: 6px;
    }
    
    .form-group {
      margin-bottom: 1.5rem;
    }
    
    label {
      display: block;
      margin-bottom: 0.5rem;
      color: #333;
      font-weight: 500;
    }
    
    input {
      width: 100%;
      padding: 1rem;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.3s;
    }
    
    input:focus {
      outline: none;
      border-color: #1d4f4d;
    }
    
    button {
      width: 100%;
      padding: 1rem;
      background: #1d4f4d;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s;
    }
    
    button:hover {
      background: #2c5f5d;
    }
    
    .error {
      color: #d32f2f;
      text-align: center;
      margin-top: 1rem;
      display: none;
    }
    
    .success {
      color: #388e3c;
      text-align: center;
      margin-top: 1rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <h1>CASA</h1>
      <span>APULIAE</span>
    </div>
    
    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required placeholder="admin">
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="••••••••">
      </div>
      
      <button type="submit">Accedi</button>
      
      <p class="error" id="error">Credenziali errate!</p>
      <p class="success" id="success">Accesso effettuato!</p>
    </form>
  </div>
  
  <script>
    // Credenziali hardcoded
    const ADMIN_USER = 'admin';
    const ADMIN_PASS = 'casapuliae2024';
    
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      
      if (username === ADMIN_USER && password === ADMIN_PASS) {
        // Salva sessione
        sessionStorage.setItem('admin_logged_in', 'true');
        document.getElementById('success').style.display = 'block';
        document.getElementById('error').style.display = 'none';
        
        // Reindirizza al CMS dopo 1 secondo
        setTimeout(function() {
          window.location.href = '/admin/cms.html';
        }, 1000);
      } else {
        document.getElementById('error').style.display = 'block';
        document.getElementById('success').style.display = 'none';
      }
    });
  </script>
</body>
</html>
