backend:
  name: git-gateway
  branch: main

media_folder: "public/images"
public_folder: "/public/images"

collections:
  - name: "eventi"
    label: "Eventi"
    folder: "content/eventi"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Titolo", name: "title", widget: "string"}
      - {label: "Data", name: "date", widget: "datetime", date_format: "DD/MM/YYYY", time_format: "HH:mm"}
      - {label: "Data Testuale", name: "data", widget: "string", hint: "Es: 25 Dicembre 2024 o 'Ogni Sabato'"}
      - {label: "Ora", name: "ora", widget: "string", hint: "Es: 08:30 - 10:30"}
      - {label: "Descrizione", name: "description", widget: "text"}
      - {label: "Prezzo", name: "prezzo", widget: "string", hint: "Es: 35€ a persona"}
      - {label: "Immagine", name: "immagine", widget: "image", choose_url: true}
      - {label: "Attivo", name: "attivo", widget: "boolean", default: true}

  - name: "pagine"
    label: "Pagine"
    files:
      - name: "home"
        label: "Homepage"
        file: "content/home.json"
        fields:
          - {label: "Titolo Hero", name: "hero_title", widget: "string"}
          - {label: "Sottotitolo Hero", name: "hero_subtitle", widget: "string"}
          - {label: "Descrizione", name: "description", widget: "text"}
          
      - name: "camere"
        label: "Camere"
        file: "content/camere.json"
        fields:
          - label: "Suite Frida Kahlo"
            name: "frida"
            widget: "object"
            fields:
              - {label: "Titolo", name: "titolo", widget: "string"}
              - {label: "Descrizione", name: "descrizione", widget: "text"}
              - {label: "Prezzo", name: "prezzo", widget: "string"}
              
          - label: "Suite Virginia Woolf"
            name: "virginia"
            widget: "object"
            fields:
              - {label: "Titolo", name: "titolo", widget: "string"}
              - {label: "Descrizione", name: "descrizione", widget: "text"}
              - {label: "Prezzo", name: "prezzo", widget: "string"}
              
          - label: "Suite Lady Diana"
            name: "diana"
            widget: "object"
            fields:
              - {label: "Titolo", name: "titolo", widget: "string"}
              - {label: "Descrizione", name: "descrizione", widget: "text"}
              - {label: "Prezzo", name: "prezzo", widget: "string"}

      - name: "contatti"
        label: "Contatti"
        file: "content/contatti.json"
        fields:
          - {label: "Telefono", name: "telefono", widget: "string"}
          - {label: "Email", name: "email", widget: "string"}
          - {label: "Indirizzo", name: "indirizzo", widget: "string"}
          - {label: "Check-in", name: "checkin", widget: "string"}
          - {label: "Check-out", name: "checkout", widget: "string"}
